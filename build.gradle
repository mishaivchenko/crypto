plugins {
    id 'base'
    id 'org.springframework.boot' version '3.5.14' apply false
    id 'io.spring.dependency-management' version '1.1.7' apply false
    id 'org.owasp.dependencycheck' version '12.1.8' apply false
    id 'info.solidsoft.pitest' version '1.19.0' apply false
    id 'com.diffplug.spotless' version '8.10.0'
    id 'com.github.spotbugs' version '6.5.11' apply false
    id 'com.autonomousapps.dependency-analysis' version '3.19.1'
    id 'net.ltgt.errorprone' version '5.1.0' apply false
}

ext {
    springBootVersion = '3.5.14'
    springCloudVersion = '2025.0.2'
    localBootProfile = 'local-safe'
    localInternalEngineToken = 'funding-local-internal-token'
}

allprojects {
    group = 'com.crypto.funding'
    version = '2.0.0'

    repositories {
        mavenCentral()
    }
}

subprojects {
    apply plugin: 'java'
    apply plugin: 'io.spring.dependency-management'
    apply plugin: 'org.owasp.dependencycheck'
    apply plugin: 'pmd'
    apply plugin: 'com.github.spotbugs'
    apply plugin: 'com.autonomousapps.dependency-analysis'
    apply plugin: 'net.ltgt.errorprone'

    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(25)
        }
    }

    dependencyManagement {
        imports {
            mavenBom "org.springframework.boot:spring-boot-dependencies:${springBootVersion}"
            mavenBom "org.springframework.cloud:spring-cloud-dependencies:${springCloudVersion}"
            mavenBom 'org.junit:junit-bom:5.14.4'
        }
        dependencies {
            dependency 'commons-fileupload:commons-fileupload:1.6.0'
            dependency 'org.apache.commons:commons-lang3:3.20.0'
            dependency 'org.apache.logging.log4j:log4j-api:2.25.4'
        }
    }

    dependencies {
        testImplementation enforcedPlatform( 'org.junit:junit-bom:5.14.4' )
        testImplementation 'org.springframework.boot:spring-boot-starter-test'
        testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
        testImplementation 'org.awaitility:awaitility:4.2.2'
        testImplementation 'org.assertj:assertj-core:3.25.3'
        testImplementation 'org.mockito:mockito-core:5.12.0'
        testImplementation 'org.wiremock:wiremock-standalone:3.0.1'
        testImplementation 'com.tngtech.archunit:archunit-junit5:1.5.0'
        spotbugsPlugins 'com.h3xstream.findsecbugs:findsecbugs-plugin:1.14.0'
        errorprone 'com.google.errorprone:error_prone_core:2.50.0'
    }

    tasks.withType(Test).configureEach {
        useJUnitPlatform()
    }

    configurations.matching { configuration -> configuration.name.toLowerCase().contains( 'test' ) }.configureEach {
        resolutionStrategy.eachDependency { details ->
            if( details.requested.group == 'org.junit.jupiter' )
            {
                details.useVersion '5.14.4'
                details.because 'ArchUnit 1.5.0 requires the matching JUnit Platform 1.14.x runtime'
            }
            if( details.requested.group == 'org.junit.platform' )
            {
                details.useVersion '1.14.4'
                details.because 'ArchUnit 1.5.0 requires org.junit.platform.engine.OutputDirectoryCreator'
            }
        }
    }

    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
        options.compilerArgs += ['-parameters']
    }

    tasks.named( 'compileJava' ).configure {
        options.errorprone.enabled = providers.gradleProperty( 'errorProneEnabled' )
            .map { it.toBoolean() }
            .orElse( true )
    }

    tasks.named( 'compileTestJava' ).configure {
        options.errorprone.enabled = false
    }

    if( project.name == 'platform-core' )
    {
        dependencies {
            compileOnly 'org.jspecify:jspecify:1.0.1'
            errorprone 'com.uber.nullaway:nullaway:0.13.8'
        }

        tasks.named( 'compileJava' ).configure {
            options.errorprone {
                check( 'NullAway', net.ltgt.gradle.errorprone.CheckSeverity.ERROR )
                option( 'NullAway:OnlyNullMarked', 'true' )
                option( 'NullAway:JSpecifyMode', 'true' )
            }
        }
    }

    dependencyCheck {
        failBuildOnCVSS = 7.0
        scanConfigurations = ['compileClasspath', 'runtimeClasspath']
        analyzers.assemblyEnabled = false
        nvd.apiKey = System.getenv( 'NVD_API_KEY' )
    }

    pmd {
        toolVersion = '7.24.0'
        ignoreFailures = true
        ruleSets = []
        ruleSetFiles = rootProject.files( 'config/pmd/ruleset.xml' )
    }

    tasks.withType( org.gradle.api.plugins.quality.Pmd ).configureEach {
        reports {
            xml.required = true
            html.required = true
        }
    }

    tasks.matching { it.name == 'pmdTest' }.configureEach {
        enabled = false
    }

    spotbugs {
        ignoreFailures = true
        effort = 'max'
        reportLevel = 'low'
    }

    tasks.withType( com.github.spotbugs.snom.SpotBugsTask ).configureEach {
        reports {
            xml.required = true
            html.required = true
        }
    }

    tasks.matching { it.name == 'spotbugsTest' }.configureEach {
        enabled = false
    }
}

dependencyAnalysis {
    reporting {
        printBuildHealth( true )
    }
    issues {
        all {
            onAny {
                severity( 'warn' )
            }
        }
    }
}

tasks.register('bootRunMonitor') {
    group = 'application'
    description = 'Run the monitor application with local-safe defaults when env is not provided'
    dependsOn ':monitor-app:bootRun'
}

tasks.register('bootRunEngine') {
    group = 'application'
    description = 'Run the engine application with local-safe defaults when env is not provided'
    dependsOn ':engine-app:bootRun'
}

project( ':monitor-app' ) {
    plugins.withId( 'org.springframework.boot' ) {
        tasks.named( 'bootRun' ) {
            environment 'SPRING_PROFILES_ACTIVE', System.getenv( 'SPRING_PROFILES_ACTIVE' ) ?: localBootProfile
            environment 'INTERNAL_ENGINE_TOKEN', System.getenv( 'INTERNAL_ENGINE_TOKEN' ) ?: localInternalEngineToken
            environment 'MONITOR_ENGINE_CONTROL_INTERNAL_TOKEN',
                System.getenv( 'MONITOR_ENGINE_CONTROL_INTERNAL_TOKEN' ) ?: ( System.getenv( 'INTERNAL_ENGINE_TOKEN' ) ?: localInternalEngineToken )
        }
    }
}

project( ':engine-app' ) {
    plugins.withId( 'org.springframework.boot' ) {
        tasks.named( 'bootRun' ) {
            environment 'SPRING_PROFILES_ACTIVE', System.getenv( 'SPRING_PROFILES_ACTIVE' ) ?: localBootProfile
            environment 'INTERNAL_ENGINE_TOKEN', System.getenv( 'INTERNAL_ENGINE_TOKEN' ) ?: localInternalEngineToken
        }
    }
}

project( ':telegram-bot-app' ) {
    plugins.withId( 'org.springframework.boot' ) {
        tasks.named( 'bootRun' ) {
            environment 'SPRING_PROFILES_ACTIVE', System.getenv( 'SPRING_PROFILES_ACTIVE' ) ?: localBootProfile
            environment 'TELEGRAM_BOT_TOKEN', System.getenv( 'TELEGRAM_BOT_TOKEN' ) ?: ''
            environment 'MONITOR_BASE_URL', System.getenv( 'MONITOR_BASE_URL' ) ?: 'http://localhost:8090'
        }
    }
}

tasks.register('bootRunTelegramBot') {
    group = 'application'
    description = 'Run the Telegram bot with local-safe defaults when env is not provided'
    dependsOn ':telegram-bot-app:bootRun'
}

tasks.register('security') {
    group = 'verification'
    description = 'Run the OWASP dependency check across all modules'
    dependsOn ':platform-core:dependencyCheckAnalyze', ':monitor-app:dependencyCheckAnalyze', ':engine-app:dependencyCheckAnalyze', ':telegram-bot-app:dependencyCheckAnalyze'
}

spotless {
    format 'misc', {
        target '*.gradle', '**/*.gradle', '**/*.md', '**/*.yml', '**/*.yaml'
        targetExclude '.claude/**', '.agents/**', '.codex/**', '.maestro/**', '**/build/**', '**/.gradle/**', '**/node_modules/**'
        trimTrailingWhitespace()
        endWithNewline()
    }
    java {
        target(
            'platform-core/src/**/*.java',
            'monitor-app/src/**/*.java',
            'engine-app/src/**/*.java',
            'telegram-bot-app/src/**/*.java'
        )
        targetExclude(
            '.claude/**',
            '.agents/**',
            '.codex/**',
            '.maestro/**',
            '**/build/**',
            '**/.gradle/**',
            '**/node_modules/**'
        )
        palantirJavaFormat('2.97.0')
        removeUnusedImports()
        forbidWildcardImports()
    }
}

tasks.register('quality') {
    group = 'verification'
    description = 'Run fast blocking code quality checks'
    dependsOn 'spotlessCheck', ':monitor-app:frontendLint', ':monitor-app:frontendFormatCheck'
}

tasks.register('qualityReport') {
    group = 'verification'
    description = 'Run report-only static analysis and dependency health checks'
    dependsOn(
        subprojects.collect { project -> project.tasks.named( 'pmdMain' ) },
        subprojects.collect { project -> project.tasks.named( 'spotbugsMain' ) },
        'buildHealth'
    )
}

tasks.register('engineTddDocsCheck') {
    group = 'verification'
    description = 'Verify engine TDD requirement IDs stay consistent across specs, gap matrix, and tests'

    inputs.files(
        fileTree( 'docs/engine-tdd' ) { include '**/*.md' },
        fileTree( 'docs/engine-tdd/requirements' ) { include '**/*.md' },
        fileTree( 'docs/engine-tdd' ) { include 'gap-matrix.md' },
        fileTree( 'engine-app/src/main/java/com/crypto/funding/engine' ) { include '*.java' },
        fileTree( 'engine-app/src/test/java' ) { include '**/*.java' },
        fileTree( 'platform-core/src/test/java' ) { include '**/*.java' },
        fileTree( 'monitor-app/src/test/java' ) { include '**/*.java' }
    )

    doLast {
        def requirementPattern = ~/\bENG-(?:ACC|CLI|CORE|CRED|EXE|PLAN|PUB|RTC|SCH|TEL)-\d{3}\b/
        def extractIds = { FileTree tree ->
            def ids = new TreeSet<String>()
            tree.files.each { file ->
                ( file.getText( 'UTF-8' ) =~ requirementPattern ).each { match ->
                    ids.add( match instanceof List ? match[0] : match )
                }
            }
            ids
        }

        FileTree requirementFiles = fileTree( 'docs/engine-tdd/requirements' ) { include '**/*.md' }
        FileTree allDocsFiles = fileTree( 'docs/engine-tdd' ) { include '**/*.md' }
        if( requirementFiles.isEmpty() )
        {
            throw new GradleException( 'No engine TDD requirement files found under docs/engine-tdd/requirements.' )
        }

        Set<String> requirementIds = extractIds( requirementFiles )
        Set<String> gapIds = extractIds( fileTree( 'docs/engine-tdd' ) { include 'gap-matrix.md' } )
        Set<String> testIds = extractIds( fileTree( projectDir ) {
            include 'engine-app/src/test/java/**/*.java'
            include 'platform-core/src/test/java/**/*.java'
            include 'monitor-app/src/test/java/**/*.java'
        } )

        if( requirementIds.isEmpty() )
        {
            throw new GradleException( 'No requirement IDs found in docs/engine-tdd/requirements.' )
        }

        def requirementWithoutGap = new TreeSet<>( requirementIds )
        requirementWithoutGap.removeAll( gapIds )
        if( !requirementWithoutGap.isEmpty() )
        {
            throw new GradleException( "Requirement IDs missing from gap matrix: ${requirementWithoutGap.join( ', ' )}" )
        }

        def gapWithoutRequirement = new TreeSet<>( gapIds )
        gapWithoutRequirement.removeAll( requirementIds )
        if( !gapWithoutRequirement.isEmpty() )
        {
            throw new GradleException( "Gap matrix contains orphan requirement IDs: ${gapWithoutRequirement.join( ', ' )}" )
        }

        def requirementWithoutTests = new TreeSet<>( requirementIds )
        requirementWithoutTests.removeAll( testIds )
        if( !requirementWithoutTests.isEmpty() )
        {
            throw new GradleException( "Requirement IDs missing from tests: ${requirementWithoutTests.join( ', ' )}" )
        }

        def testWithoutRequirement = new TreeSet<>( testIds )
        testWithoutRequirement.removeAll( requirementIds )
        if( !testWithoutRequirement.isEmpty() )
        {
            throw new GradleException( "Tests contain orphan requirement IDs: ${testWithoutRequirement.join( ', ' )}" )
        }

        def docsText = allDocsFiles.files.collect { it.getText( 'UTF-8' ) }.join( System.lineSeparator() )
        def gapMatrixText = file( 'docs/engine-tdd/gap-matrix.md' ).getText( 'UTF-8' )
        def engineProductionClasses = fileTree( 'engine-app/src/main/java/com/crypto/funding/engine' ) {
            include '*.java'
            exclude 'package-info.java'
        }.files.collect { it.name - '.java' } as Set<String>

        def undocumentedClasses = new TreeSet<>( engineProductionClasses.findAll { !docsText.contains( it ) } )
        if( !undocumentedClasses.isEmpty() )
        {
            throw new GradleException( "Engine production classes missing from docs/engine-tdd: ${undocumentedClasses.join( ', ' )}" )
        }

        def gapUnmappedClasses = new TreeSet<>( engineProductionClasses.findAll { !gapMatrixText.contains( it ) } )
        if( !gapUnmappedClasses.isEmpty() )
        {
            throw new GradleException( "Engine production classes missing from gap matrix: ${gapUnmappedClasses.join( ', ' )}" )
        }
    }
}

tasks.register('engineTddGate') {
    group = 'verification'
    description = 'Run engine TDD docs, acceptance, coverage, and mutation gates'
    dependsOn(
        'engineTddDocsCheck',
        ':platform-core:test',
        ':platform-core:engineTddCoverageVerification',
        ':platform-core:pitest',
        ':engine-app:test',
        ':engine-app:engineTddCoverageVerification',
        ':engine-app:pitest',
        ':monitor-app:engineAcceptanceTest'
    )
}
