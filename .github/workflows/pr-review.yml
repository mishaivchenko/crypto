name: PR Review

on:
  # Runs after CI-CD completes so the review can include build/test results
  workflow_run:
    workflows: [ "CI-CD" ]
    types: [ completed ]

# One review per PR branch at a time — cancel stale runs on force-push
concurrency:
  group: pr-review-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: true

jobs:
  review:
    name: DeepSeek PR Review
    # Only review pull_request triggered CI runs (not push/schedule)
    if: github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: read
      actions: read

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve PR number from workflow run
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          RUN_HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          REPO: ${{ github.repository }}
        run: |
          # Try by SHA first, then fall back to branch name
          pr_number=$(gh pr list \
            --repo "$REPO" \
            --state open \
            --json number,headRefOid \
            --jq --arg sha "$RUN_HEAD_SHA" '.[] | select(.headRefOid == $sha) | .number' \
            | head -1)
          if [ -z "$pr_number" ]; then
            pr_number=$(gh pr list \
              --repo "$REPO" \
              --state open \
              --head "$RUN_HEAD_BRANCH" \
              --json number \
              --jq '.[0].number' \
              2>/dev/null | head -1)
          fi
          if [ -z "$pr_number" ] || [ "$pr_number" = "null" ]; then
            echo "No open PR found for SHA $RUN_HEAD_SHA / branch $RUN_HEAD_BRANCH — skipping review"
            exit 0
          fi
          echo "number=$pr_number" >> "$GITHUB_OUTPUT"

      - name: Download CI artifacts
        if: steps.pr.outputs.number != ''
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}
          path: /tmp/ci-artifacts

      - name: Compose CI context
        id: ci_ctx
        if: steps.pr.outputs.number != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          RUN_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
        run: |
          gh run view "${RUN_ID}" --repo "${REPO}" --json jobs > /tmp/ci-jobs.json \
            || echo '{"jobs":[]}' > /tmp/ci-jobs.json
          python3 scripts/pr_review/ci_summary.py \
            --run-json /tmp/ci-jobs.json \
            --artifacts-dir /tmp/ci-artifacts \
            --run-id "${RUN_ID}" \
            --run-url "${RUN_URL}" \
            --conclusion "${RUN_CONCLUSION}" \
            --output /tmp/ci-summary.json \
            --markdown /tmp/ci-summary.md
          {
            echo "CI-CD workflow run:"
            echo "- conclusion: ${RUN_CONCLUSION}"
            echo "- run id: ${RUN_ID}"
            echo "- url: ${RUN_URL}"
            echo ""
            echo "Job results:"
            gh run view "${RUN_ID}" --repo "${REPO}" --json jobs \
              --jq '.jobs[] | "- \(.name): \(.conclusion // "unknown")"' \
              || echo "- unable to fetch job results"

            if [ -d /tmp/ci-artifacts ]; then
              echo ""
              echo "Downloaded CI artifacts:"
              find /tmp/ci-artifacts -type f | sort | sed 's#^#- #'

              for log_name in build-output.txt code-quality-output.txt sonarqube-output.txt; do
                log_file="$(find /tmp/ci-artifacts -name "${log_name}" -type f | head -1)"
                if [ -n "${log_file}" ]; then
                  echo ""
                  echo "--- Last 160 lines of ${log_name} ---"
                  tail -160 "${log_file}"
                fi
              done
            fi

            if [ -f /tmp/ci-summary.md ]; then
              echo ""
              echo "--- Structured CI summary ---"
              cat /tmp/ci-summary.md
            fi
          } > /tmp/ci-context.txt

      - name: Run PR review
        if: steps.pr.outputs.number != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
        run: |
          if [ -f /tmp/ci-context.txt ]; then
            export CI_CONTEXT="$(cat /tmp/ci-context.txt)"
          fi
          if [ -f /tmp/ci-summary.json ]; then
            export CI_SUMMARY_JSON="$(cat /tmp/ci-summary.json)"
          fi
          python3 scripts/pr_review/main.py
